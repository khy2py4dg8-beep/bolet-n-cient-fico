name: Enviar Boletín Diario

on:
  schedule:
    - cron: '0 12 * * *' # Corre diario a las 6:00 AM hora del centro de México
  workflow_dispatch:     # Permite ejecución manual

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install feedparser groq requests

      - name: Ejecutar Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python boletin.py

      - name: Guardar historico JSON en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_noticias.json
          git commit -m "Auto-update: Base de datos historico DeNadA" || exit 0
          git push
